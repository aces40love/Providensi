<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">One service launch, a coordinated set of campaign materials</title>
  <desc id="description">An illustrative landing page, presentation, and social post for a fictional client onboarding service. These are design concepts, not product screenshots or reported customer results.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8e1d3"/><stop offset="1" stop-color="#c7c3b6"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283a38"/><stop offset="1" stop-color="#142321"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d598"/><stop offset="1" stop-color="#bb9756"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1c241d" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1440" height="1080" fill="url(#background)"/>
  <circle cx="1280" cy="180" r="345" fill="none" stroke="#95825b" stroke-opacity=".2"/>
  <circle cx="1280" cy="180" r="277" fill="none" stroke="#95825b" stroke-opacity=".14"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="76" y="66" fill="#655b43" font-size="17" font-weight="600" letter-spacing="3">ONE SERVICE LAUNCH. ONE COHERENT STORY.</text>
    <g transform="translate(80 110)" filter="url(#shadow)">
      <rect width="1000" height="588" rx="17" fill="#f8f5ee"/>
      <path d="M17 0h966a17 17 0 0 1 17 17v37H0V17A17 17 0 0 1 17 0" fill="#d8d7cc"/>
      <circle cx="27" cy="27" r="5" fill="#b4aa92"/><circle cx="46" cy="27" r="5" fill="#b4aa92"/><circle cx="65" cy="27" r="5" fill="#b4aa92"/>
      <rect x="270" y="16" width="460" height="23" rx="6" fill="#e9e7dc"/>
      <text x="500" y="33" text-anchor="middle" fill="#727463" font-size="12" letter-spacing="1.5">LANDING PAGE / DESIGN CONCEPT</text>
      <circle cx="53" cy="93" r="12" fill="#324c45"/><path d="m48 93 4 4 7-9" fill="none" stroke="#ead59e" stroke-width="2"/>
      <text x="78" y="99" fill="#2c3d36" font-size="19" font-weight="600" letter-spacing="2">FIRST STEP</text>
      <text x="663" y="98" fill="#6c7565" font-size="13">Our approach</text><text x="789" y="98" fill="#6c7565" font-size="13">For your team</text>
      <rect x="896" y="78" width="70" height="29" rx="4" fill="#2b4339"/><text x="931" y="97" text-anchor="middle" fill="#f3ebd5" font-size="11">Let’s talk</text>
      <path d="M34 127h932" stroke="#dddcd0"/>
      <text x="46" y="180" fill="#8d7849" font-size="12" font-weight="600" letter-spacing="2">A NEW CLIENT ONBOARDING SERVICE</text>
      <text x="43" y="239" fill="#25372f" font-size="43" font-weight="500" letter-spacing="-1.5"><tspan x="43">A better beginning.</tspan><tspan x="43" dy="51">For every new client.</tspan></text>
      <text x="46" y="337" fill="#6a7164" font-size="16"><tspan x="46">Bring the welcome, the next steps, and the right</tspan><tspan x="46" dy="25">people together in one clear experience.</tspan></text>
      <rect x="46" y="397" width="203" height="44" rx="5" fill="#294238"/><text x="66" y="425" fill="#f3e7cd" font-size="14">Explore the approach</text><text x="220" y="425" fill="#ddc080" font-size="18">↗</text>
      <g transform="translate(562 164)">
        <rect width="392" height="278" rx="10" fill="url(#panel)"/>
        <circle cx="196" cy="139" r="100" fill="none" stroke="#8d9779" stroke-opacity=".36"/>
        <circle cx="196" cy="139" r="66" fill="none" stroke="#9d9f80" stroke-opacity=".3"/>
        <path d="M74 185 169 89 250 166 321 74" fill="none" stroke="url(#gold)" stroke-width="3"/>
        <circle cx="74" cy="185" r="15" fill="#dcc68f"/><circle cx="169" cy="89" r="15" fill="#dcc68f"/><circle cx="250" cy="166" r="15" fill="#dcc68f"/><circle cx="321" cy="74" r="15" fill="#dcc68f"/>
        <text x="74" y="190" text-anchor="middle" fill="#324433" font-size="12">1</text><text x="169" y="94" text-anchor="middle" fill="#324433" font-size="12">2</text><text x="250" y="171" text-anchor="middle" fill="#324433" font-size="12">3</text><text x="321" y="79" text-anchor="middle" fill="#324433" font-size="12">4</text>
        <text x="22" y="249" fill="#cfceb7" font-size="11" letter-spacing="1.5">WELCOME. CONNECT. MOVE FORWARD.</text>
      </g>
      <path d="M46 481h908" stroke="#dcdcd0"/>
      <text x="46" y="523" fill="#334337" font-size="17">A clear welcome</text><text x="360" y="523" fill="#334337" font-size="17">A shared starting point</text><text x="700" y="523" fill="#334337" font-size="17">A useful next step</text>
      <path d="M46 546h217M360 546h218M700 546h216" stroke="#c7cbbb" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(884 550) rotate(5 220 208)" filter="url(#shadow)">
      <rect width="442" height="415" rx="13" fill="url(#panel)"/>
      <text x="33" y="43" fill="#d7c18a" font-size="11" font-weight="600" letter-spacing="2">SOCIAL POST / CONCEPT</text>
      <text x="32" y="105" fill="#f3eedf" font-size="35" font-weight="500" letter-spacing="-1"><tspan x="32">The first impression.</tspan><tspan x="32" dy="43">Make it a good one.</tspan></text>
      <path d="M56 260h329" stroke="#546957" stroke-width="1"/>
      <circle cx="84" cy="260" r="29" fill="#d9c08a"/><circle cx="220" cy="260" r="29" fill="#d9c08a"/><circle cx="357" cy="260" r="29" fill="#d9c08a"/>
      <path d="m75 260 6 6 13-14m117 8 6 6 13-14m118 8 6 6 13-14" fill="none" stroke="#30422f" stroke-width="3"/>
      <text x="33" y="358" fill="#ede6ce" font-size="14" letter-spacing="2">FIRST STEP</text>
      <text x="33" y="383" fill="#a7b4a0" font-size="10">A fictional client onboarding service.</text>
    </g>
    <g transform="translate(135 655) rotate(-4 338 148)" filter="url(#shadow)">
      <rect width="679" height="292" rx="10" fill="#faf7ee"/>
      <rect width="12" height="292" rx="5" fill="#c2a668"/>
      <text x="37" y="44" fill="#8f7948" font-size="11" font-weight="600" letter-spacing="2">PRESENTATION / CONCEPT</text>
      <text x="35" y="98" fill="#293d33" font-size="32" font-weight="500" letter-spacing="-.8">Start with the experience.</text>
      <text x="38" y="135" fill="#7a806f" font-size="13">One message, carried through the whole launch.</text>
      <g fill="#e8e8dc"><rect x="37" y="167" width="180" height="82" rx="6"/><rect x="247" y="167" width="180" height="82" rx="6"/><rect x="457" y="167" width="180" height="82" rx="6"/></g>
      <g fill="#9d844f" font-size="12"><text x="53" y="193">01</text><text x="263" y="193">02</text><text x="473" y="193">03</text></g>
      <g fill="#374734" font-size="14"><text x="53" y="224">Understand the need</text><text x="263" y="224">Shape the service</text><text x="473" y="224">Bring it to market</text></g>
    </g>
    <text x="76" y="1032" fill="#6c644f" font-size="13" letter-spacing="1.4">ILLUSTRATIVE BUSINESS DELIVERABLES. NOT A PRODUCT SCREENSHOT.</text>
  </g>
</svg>
